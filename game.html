<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0B1F3A"/>
  <title>Dypdykk 110 · Mannhullet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <!-- Bump ?v= on each release so browsers don't mix old and new files -->
  <link rel="stylesheet" href="dypdykk/style.css?v=110"/>
</head>
<body>
<div id="layout">
  <!-- Brass porthole frame around the game -->
  <div id="game-wrap">
    <span class="bolt tl"></span><span class="bolt tc"></span><span class="bolt tr"></span>
    <span class="bolt ml"></span><span class="bolt mr"></span>
    <span class="bolt bl"></span><span class="bolt bc"></span><span class="bolt br"></span>

    <div id="viewport">
      <canvas id="c" width="360" height="540" aria-label="Dypdykk 110"></canvas>
      <div id="ui">
        <div id="score-display">0</div>

        <div class="screen" id="start-screen">
          <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">
            <circle class="emblem-ring" cx="32" cy="32" r="27"/>
            <circle class="emblem-glass" cx="32" cy="32" r="23.5"/>
            <g class="emblem-bolts">
              <circle cx="32" cy="5" r="1.6"/><circle cx="51.1" cy="12.9" r="1.6"/>
              <circle cx="59" cy="32" r="1.6"/><circle cx="51.1" cy="51.1" r="1.6"/>
              <circle cx="32" cy="59" r="1.6"/><circle cx="12.9" cy="51.1" r="1.6"/>
              <circle cx="5" cy="32" r="1.6"/><circle cx="12.9" cy="12.9" r="1.6"/>
            </g>
            <text class="emblem-text" x="32" y="37.5" text-anchor="middle">110</text>
          </svg>
          <div class="screen-title">Dypdykk <span class="num">110</span></div>
          <div class="screen-sub">Mannhullet 110 år</div>
          <input class="name-input" id="player-name" type="text" maxlength="16" placeholder="Navnet ditt…" autocomplete="nickname"/>
          <button class="btn" id="start-btn">Start dykket</button>
          <div class="tip">Trykk eller mellomrom for å svømme</div>
        </div>

        <div class="screen hidden" id="over-screen">
          <div id="medal"></div>
          <div class="screen-title">Tauet røk!</div>
          <div class="rule"></div>
          <div class="stat-row">
            <div class="stat"><div class="stat-label">Poeng</div><div class="stat-val" id="final-score">0</div></div>
            <div class="stat"><div class="stat-label">Din beste</div><div class="stat-val hi" id="best-score">0</div></div>
          </div>
          <button class="btn" id="retry-btn">Prøv igjen</button>
          <button class="btn secondary" id="menu-btn">Meny</button>
          <div id="saving-msg"></div>
        </div>

        <div class="screen hidden" id="pause-screen">
          <div class="screen-title">Pause</div>
          <div class="tip">Trykk eller mellomrom for å fortsette</div>
        </div>
      </div>
    </div>
  </div>

  <div id="leaderboard">
    <div id="lb-header">
      <div id="lb-title">Toppliste</div>
      <div id="lb-sub">Beste poeng per spiller · Topp 10</div>
    </div>
    <div id="lb-list"><div class="lb-empty">Laster…</div></div>
    <div id="lb-footer">Oppdateres live</div>
  </div>
</div>

<script type="module" src="dypdykk/js/main.js?v=110"></script>
</body>
</html>
